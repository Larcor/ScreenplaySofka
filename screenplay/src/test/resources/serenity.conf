# =============================================================================
# Serenity BDD Configuration
# =============================================================================

webdriver {
  driver = chrome
  autodownload = true
  
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = [
        "--start-maximized",
        "--incognito",
        "--disable-infobars",
        "--disable-gpu",
        "--disable-popup-blocking",
        "--remote-allow-origins=*",
        "--ignore-certificate-errors",
        "--ignore-ssl-errors=yes"
      ]
    }
  }
}

# =============================================================================
# Environments
# =============================================================================
environments {
  default {
    webdriver.base.url = "https://opencart.abstracta.us/"
  }
  
  staging {
    webdriver.base.url = "https://staging.opencart.abstracta.us/"
  }
}

# =============================================================================
# Serenity Reporting Configuration
# =============================================================================
serenity {
  # Encoding
  encoding = "UTF-8"
  
  # Screenshots
  take.screenshots = AFTER_EACH_STEP
  compress.filenames = true
  
  # Output
  outputDirectory = "target/site/serenity"
  
  # Reports
  report {
    show.step.details = true
    show.manual.tests = false
    show.releases = false
    show.title = true
    encoding = "UTF-8"
  }
  
  # Logging
  logging = "VERBOSE"
  verbose.steps = true
  
  # Browser Management
  use.unique.browser = true
  restart.browser.for.each = scenario
  
  # Requirements
  requirements.dir = "src/test/resources/features"
}